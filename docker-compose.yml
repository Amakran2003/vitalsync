services:
  backend:
    build:
      context: ./backend
    container_name: vitalsync-backend
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      - db
    ports:
      - "${BACKEND_PORT}:${BACKEND_CONTAINER_PORT}"
    networks:
      - vitalsync-net

  frontend:
    build:
      context: ./frontend
    container_name: vitalsync-frontend
    env_file:
      - .env
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_CONTAINER_PORT}"
    networks:
      - vitalsync-net

  db:
    image: postgres:16-alpine
    container_name: vitalsync-db
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_CONTAINER_PORT}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - vitalsync-net

networks:
  vitalsync-net:
    driver: bridge

volumes:
  postgres-data:
